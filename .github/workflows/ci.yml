name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet build TinyBus.slnx -c Release -warnaserror

      - run: dotnet test TinyBus.slnx -c Release --no-build --no-restore -warnaserror

      - name: Verify the release train from real packages
        shell: pwsh
        run: ./tests/TinyBus.PackageTests/Verify-Package.ps1
